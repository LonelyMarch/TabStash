name: TabStash checks

on:
  push:
    branches:
      - dev
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:chrome
      - run: pnpm zip
      - run: pnpm zip:chrome
      - run: pnpm check:package
      # Windows runner 自带 Edge；Chrome 使用隔离的免安装测试版本。
      - name: Chrome for Testing
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.base_ref == 'master' || github.event_name == 'workflow_dispatch'
        run: pnpm install:chrome-test
      - name: Edge and Chrome E2E
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.base_ref == 'master' || github.event_name == 'workflow_dispatch'
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-packages-and-test-results
          # .output 是隐藏目录；仅允许下方列出的发布包、校验和及测试报告进入 CI 附件。
          include-hidden-files: true
          path: |
            .output/*.zip
            .output/SHA256SUMS.txt
            playwright-report/
            test-results/
          if-no-files-found: warn
